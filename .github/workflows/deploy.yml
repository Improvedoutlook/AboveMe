name: Deploy to GitHub Pages

# Run workflow on every push to the develop-main branch
on:
  push:
    branches: [ develop-main ]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Allow one concurrent deployment
concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
    - name: Checkout
      uses: actions/checkout@v4
      
    - name: Setup .NET
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: '9.0.x'
        
    - name: Restore dependencies
      run: dotnet restore
      
    - name: Build
      run: dotnet build --configuration Release --no-restore
      
    - name: Publish
      run: dotnet publish --configuration Release --no-build --output publish
      
    - name: Inject API keys into appsettings.json
      run: |
        # Replace DEMO_KEY values with actual API keys from GitHub Secrets
        sed -i 's/"NasaApiKey": "DEMO_KEY"/"NasaApiKey": "${{ secrets.NASA_API_KEY }}"/g' publish/wwwroot/appsettings.json
        sed -i 's/"AstronomyApiKey": "DEMO_KEY"/"AstronomyApiKey": "${{ secrets.ASTRONOMY_API_KEY }}"/g' publish/wwwroot/appsettings.json
      
    - name: Change base-tag in index.html
      run: sed -i 's/<base href="\/" \/>/<base href="\/AboveMe\/" \/>/g' publish/wwwroot/index.html
      
    - name: Add .nojekyll file
      run: touch publish/wwwroot/.nojekyll
      
    - name: Copy index.html to 404.html
      run: cp publish/wwwroot/index.html publish/wwwroot/404.html
      
    - name: Upload artifact
      uses: actions/upload-pages-artifact@v3
      with:
        path: 'publish/wwwroot'

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
    - name: Deploy to GitHub Pages
      id: deployment
      uses: actions/deploy-pages@v4
